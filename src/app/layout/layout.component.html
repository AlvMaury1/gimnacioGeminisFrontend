<mat-sidenav-container class="sidenav-container">

  <mat-sidenav mode="side" opened class="sidenav">
    <div class="sidenav-header">
     <img src="assets/geminis.ico" class="logo-icon" alt="Geminis">
    </div>

    <mat-divider></mat-divider>

    <div class="user-info">
      <mat-icon>account_circle</mat-icon>
      <div>
        <p class="user-email">{{ userEmail }}</p>
        <p class="user-rol">{{ userRol }}</p>
      </div>
    </div>

    <mat-divider></mat-divider>

    <mat-nav-list>
      @for (item of visibleMenuItems; track item.route) {
        <a mat-list-item
           [routerLink]="item.route"
           routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span class="sidenav-text" matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="sidenav-footer">
      <mat-divider></mat-divider>
      <button mat-button class="logout-btn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Cerrar sesión
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">

    <div class="content-wrapper">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
